const KEY='ood_annot_v1';
let S = JSON.parse(localStorage.getItem(KEY)||'{"i":0,"labels":{}}');
function save(){localStorage.setItem(KEY,JSON.stringify(S));document.getElementById('saved').textContent='已自动保存 '+Object.keys(S.labels).length+'/'+DATA.length;}
function render(){
  const r=DATA[S.i]; if(!r){document.getElementById('text').innerHTML='<span class="done">🎉 全部标完！点右上角「导出结果」下载文件。</span>';document.getElementById('prog').textContent='完成';return;}
  document.getElementById('text').textContent=r.text;
  document.getElementById('meta').textContent='第 '+(S.i+1)+' / '+DATA.length+' 条 · cid '+r.cid+' · '+r.len+' 字';
  document.getElementById('pos').textContent=(S.i+1)+'/'+DATA.length;
  document.getElementById('prog').textContent='已标 '+Object.keys(S.labels).length+'/'+DATA.length;
  document.querySelectorAll('.flag').forEach(c=>c.checked=false);
  const cur=S.labels[r.cid];
  if(cur){document.querySelectorAll('.flag').forEach(c=>{if(cur.flags.includes(c.value))c.checked=true;});}
  save();
}
function label(l){
  const r=DATA[S.i]; if(!r)return;
  const flags=[...document.querySelectorAll('.flag:checked')].map(c=>c.value);
  S.labels[r.cid]={label:l,flags,ts:Date.now()};
  save(); move(1);
}
function move(d){S.i=Math.min(DATA.length-1,Math.max(0,S.i+d));render();window.scrollTo(0,0);}
document.addEventListener('keydown',e=>{
  if(e.key==='1')label('正面'); else if(e.key==='2')label('中性'); else if(e.key==='3')label('负面');
  else if(e.key==='ArrowLeft')move(-1); else if(e.key==='ArrowRight')move(1);
});
document.getElementById('export').onclick=()=>{
  const out=DATA.map(r=>{const a=S.labels[r.cid]||{};return {cid:r.cid,text:r.text,label:a.label||'',flags:(a.flags||[]).join('|'),ts:a.ts||0};});
  const blob=new Blob([out.map(o=>JSON.stringify(o)).join('\n')],{type:'application/json'});
  const a=document.createElement('a');a.href=URL.createObjectURL(blob);a.download='ood_human_labels.jsonl';a.click();
};
render();
</script>
